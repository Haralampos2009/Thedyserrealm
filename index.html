<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thedyserrealm</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Подключаем шрифты: Inter и дизайнерский Syne для ника -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #020b05;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ФОН С МОЛНИЯМИ И ЭЛЕКТРИЧЕСТВОМ --- */
        .lightning-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 10% 20%, rgba(5, 150, 105, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 45%);
        }

        /* Вспышки молний */
        .lightning-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(52, 211, 153, 0.25), transparent 70%);
            opacity: 0;
            animation: flash 4s infinite alternate;
        }

        @keyframes flash {
            0%, 90%, 94%, 98%, 100% { opacity: 0; }
            92%, 96% { opacity: 0.6; }
        }

        /* Линии молний */
        svg.lightning-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.25;
            filter: drop-shadow(0 0 8px #34d399);
        }

        /* Общая сетка */
        .site-container {
            display: flex;
            gap: 40px;
            max-width: 950px;
            width: 100%;
            align-items: flex-start;
            z-index: 1;
        }

        @media(max-width: 800px) {
            .site-container {
                flex-direction: column;
                align-items: center;
            }
        }

        /* --- ЛЕВАЯ КАРТОЧКА ПРОФИЛЯ С ИНТЕРАКТИВНЫМ 3D НАКЛОНОМ --- */
        .profile-sidebar {
            width: 320px;
            flex-shrink: 0;
            perspective: 1000px;
        }

        .profile-card {
            background: rgba(4, 20, 11, 0.82);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 24px;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(16, 185, 129, 0.1);
            
            /* Для плавного восстановления при уходе мышки */
            transition: transform 0.15s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .profile-card:hover {
            border-color: rgba(52, 211, 153, 0.45);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(16, 185, 129, 0.2);
        }

        /* Аватар */
        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 18px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.45);
            border: 2px solid rgba(52, 211, 153, 0.3);
        }

        /* Индикатор статуса прямо на аватаре */
        .status-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #04140b;
            background-color: #747f8d;
        }

        /* Дизайнерский шрифт для ника */
        .profile-name {
            font-family: 'Syne', sans-serif;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sparkle {
            -webkit-text-fill-color: initial;
            font-size: 16px;
        }

        /* Анимация печатания букв */
        .profile-bio {
            font-size: 13px;
            color: #a7f3d0;
            margin-bottom: 16px;
            font-style: italic;
            text-align: center;
            min-height: 20px;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 13px;
            background-color: #34d399;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Плашка статуса с иконкой Discord */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(52, 211, 153, 0.12);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        /* Иконки статусов как в Discord */
        .status-dot-icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }

        .status-dot-online {
            background-color: #23a55a;
            box-shadow: 0 0 8px #23a55a;
        }

        .status-dot-idle {
            background-color: #f0b232;
            border-radius: 50%;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
        }

        .status-dot-dnd {
            background-color: #f23f43;
            box-shadow: 0 0 8px rgba(242, 63, 67, 0.5);
        }
        .status-dot-dnd::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 2px;
            width: 6px;
            height: 2px;
            background-color: #04140b;
        }

        .status-dot-offline {
            background-color: #80848e;
        }

        /* Блок со временем и просмотрами */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 24px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: #6b7280;
            letter-spacing: 0.5px;
        }

        /* Кнопки соцсетей */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .social-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            border-radius: 14px;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(52, 211, 153, 0.3);
            color: #fff;
            transform: translateY(-2px);
        }

        .arrow {
            color: #6b7280;
            font-size: 14px;
            transition: color 0.2s;
        }

        .social-btn:hover .arrow {
            color: #34d399;
        }

        /* --- ПРАВАЯ ЧАСТЬ (ПРОЕКТЫ) --- */
        .main-content {
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 16px;
            font-style: italic;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .project-card {
            background: rgba(4, 20, 11, 0.82);
            border: 1px solid rgba(52, 211, 153, 0.15);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-color: rgba(52, 211, 153, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .project-img-box {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .proj-emoji {
            font-size: 36px;
        }

        .project-info {
            padding: 16px;
        }

        .project-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }

        .project-info p {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 12px;
            font-style: italic;
        }

        .project-link {
            font-size: 11px;
            color: #34d399;
            text-decoration: none;
        }

        .project-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Фон с эффектом молний -->
    <div class="lightning-bg">
        <div class="lightning-flash"></div>
        <svg class="lightning-lines" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <path d="M 150 0 L 120 200 L 220 220 L 90 500 L 180 520 L 40 800" stroke="#34d399" stroke-width="2" fill="none"/>
            <path d="M 850 0 L 880 250 L 780 280 L 910 600 L 820 630 L 960 1000" stroke="#10b981" stroke-width="1.5" fill="none"/>
        </svg>
    </div>

    <div class="site-container">
        <!-- Левая колонка: Карточка профиля -->
        <aside class="profile-sidebar">
            <div class="profile-card" id="tiltCard">
                <!-- Аватар и статус -->
                <div class="avatar-container">
                    <img id="discord-avatar" src="favicon.png" alt="Avatar" class="avatar-img">
                    <span id="discord-status" class="status-indicator"></span>
                </div>

                <!-- Имя со шрифтом Syne -->
                <h1 class="profile-name">lampik2009 <span class="sparkle">✨</span></h1>
                
                <!-- Био с эффектом печатания -->
                <p class="profile-bio"><span id="typed-text"></span><span class="typing-cursor"></span></p>

                <!-- Статус-плашка -->
                <div class="status-pill">
                    <span class="status-dot-icon status-dot-offline" id="status-dot"></span>
                    <span id="status-text">offline</span>
                </div>

                <!-- Виджет времени и просмотров -->
                <div class="stats-grid">
                    <div class="stat-box">
                        <div id="local-time" class="stat-value">10:37:58 AM</div>
                        <div class="stat-label">LOCAL TIME</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">802</div>
                        <div class="stat-label">VIEWS</div>
                    </div>
                </div>

                <!-- Ссылки на соцсети -->
                <div class="social-links">
                    <a href="https://discord.com/users/1142187822250471535" target="_blank" class="social-btn">
                        <span>Discord</span>
                        <span class="arrow">↗</span>
                    </a>
                    <a href="https://github.com/Haralampos2009" target="_blank" class="social-btn">
                        <span>GitHub</span>
                        <span class="arrow">↗</span>
                    </a>
                    <a href="https://www.youtube.com/@Dyser_l" target="_blank" class="social-btn">
                        <span>YouTube</span>
                        <span class="arrow">↗</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Правая колонка: Проекты -->
        <main class="main-content">
            <section class="content-section">
                <h2 class="section-title">projects</h2>
                <div class="projects-grid">
                    <div class="project-card">
                        <div class="project-img-box" style="background: linear-gradient(135deg, #064e3b, #047857);">
                            <span class="proj-emoji">⚡</span>
                        </div>
                        <div class="project-info">
                            <h3>Thedyserrealm</h3>
                            <p>the site you're on</p>
                            <a href="#" class="project-link">thedyserrealm.github.io ↗</a>
                        </div>
                    </div>

                    <div class="project-card">
                        <div class="project-img-box" style="background: linear-gradient(135deg, #022c22, #065f46);">
                            <span class="proj-emoji">🎮</span>
                        </div>
                        <div class="project-info">
                            <h3>Smash Blast</h3>
                            <p>my very own game</p>
                            <a href="#" class="project-link">github.com/Haralampos2009 ↗</a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Интерактивные скрипты -->
    <script>
        // --- 1. ЭФФЕКТ НАКЛОНА КАРТОЧКИ ЗА МЫШКОЙ (3D TILT) ---
        const card = document.getElementById('tiltCard');

        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;

            // Вычисляем расстояние от центра карточки до курсора
            const angleX = (e.clientY - cardCenterY) / 25;
            const angleY = (cardCenterX - e.clientX) / 25;

            // Ограничиваем максимальный угол наклона
            const clampedX = Math.max(-15, Math.min(15, angleX));
            const clampedY = Math.max(-15, Math.min(15, angleY));

            card.style.transform = `rotateX(${clampedX}deg) rotateY(${clampedY}deg)`;
        });

        // Возврат карточки в нормальное положение
        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        // --- 2. ЭФФЕКТ ПЕЧАТАНИЯ ТЕКСТА (TYPEWRITER) ---
        let textToType = "Hello";
        let typedElement = document.getElementById('typed-text');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typedElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 150);
            }
        }
        typeWriter();

        // --- 3. ДИНАМИЧЕСКИЕ ЧАСЫ ---
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('local-time').textContent = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- 4. ДАННЫЕ И СТАТУС DISCORD (LANYARD API) ---
        const DISCORD_ID = '1142187822250471535';

        async function loadDiscordData() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await res.json();

                if (data.success) {
                    const { discord_user, discord_status, activities } = data.data;

                    // Обновляем аватар
                    if (discord_user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${discord_user.id}/${discord_user.avatar}.png?size=256`;
                        document.getElementById('discord-avatar').src = avatarUrl;
                    }

                    // Обновляем статус
                    const statusDot = document.getElementById('status-dot');
                    const statusText = document.getElementById('status-text');
                    statusText.textContent = discord_status;
                    statusDot.className = `status-dot-icon status-dot-${discord_status}`;

                    // Если в Discord есть кастомный статус, заменяем "Hello" на него
                    if (activities && activities.length > 0) {
                        const custom = activities.find(a => a.type === 4);
                        if (custom && custom.state) {
                            textToType = custom.state;
                            typedElement.textContent = "";
                            charIndex = 0;
                            typeWriter();
                        }
                    }
                }
            } catch (e) {
                console.error("Ошибка Lanyard:", e);
            }
        }
        loadDiscordData();
    </script>
</body>
</html>
