<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thedyserrealm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <nav class="sidebar">
        <!-- Аватарка и статус Discord -->
        <div class="profile-avatar-container">
            <img id="discord-avatar" src="favicon.png" alt="Discord Avatar" class="avatar-img">
            <span id="discord-status" class="status-indicator"></span>
        </div>

        <ul>
            <li><a href="#about" class="active">O nas</a></li>
            <li><a href="#projects">Проекты</a></li>
            <li><a href="#socials">Соцсети</a></li>
        </ul>
    </nav>

    <main class="content">
        <section id="about" class="section">
            <h1>O nas</h1>
            <p>Добро пожаловать в Thedyserrealm.</p>
        </section>

        <section id="projects" class="section">
            <h1>Проекты</h1>
            <p>Здесь будут отображаться ваши проекты.</p>
        </section>

        <section id="socials" class="section">
            <h1>Соцсети</h1>
            <p>Ссылки на ваши социальные сети.</p>
        </section>
    </main>

    <!-- Скрипт подгрузки профиля Discord -->
    <script>
        const DISCORD_ID = '1142187822250471535'; 

        async function loadDiscordAvatar() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await res.json();

                if (data.success) {
                    const { discord_user, discord_status } = data.data;

                    const avatarUrl = discord_user.avatar 
                        ? `https://cdn.discordapp.com/avatars/${discord_user.id}/${discord_user.avatar}.png?size=256`
                        : `https://cdn.discordapp.com/embed/avatars/0.png`;

                    const avatarElement = document.getElementById('discord-avatar');
                    const statusElement = document.getElementById('discord-status');

                    if (avatarElement) avatarElement.src = avatarUrl;
                    if (statusElement) statusElement.className = `status-indicator status-${discord_status}`;
                }
            } catch (err) {
                console.error("Ошибка при загрузке аватара:", err);
            }
        }

        loadDiscordAvatar();
    </script>
</body>
</html>
