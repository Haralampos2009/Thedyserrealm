<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thedyserrealm</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Подключаем шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Профессиональный темно-зеленый фон с эффектом электричества и молний */
            background-color: #020f07;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(5, 150, 105, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #010a04 0%, #031c0c 50%, #010a04 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Декоративные световые линии (молнии/энергия на фоне) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(90deg, transparent 98%, rgba(52, 211, 153, 0.03) 100%),
                linear-gradient(0deg, transparent 98%, rgba(52, 211, 153, 0.03) 100%);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: -1;
        }

        /* Общая сетка */
        .site-container {
            display: flex;
            gap: 40px;
            max-width: 950px;
            width: 100%;
            align-items: flex-start;
        }

        @media(max-width: 800px) {
            .site-container {
                flex-direction: column;
                align-items: center;
            }
        }

        /* --- ЛЕВАЯ КАРТОЧКА ПРОФИЛЯ С НАКЛОНОМ --- */
        .profile-sidebar {
            width: 320px;
            flex-shrink: 0;
            perspective: 1000px; /* Важно для 3D наклона */
        }

        .profile-card {
            background: rgba(6, 26, 14, 0.75);
            border: 1px solid rgba(52, 211, 153, 0.15);
            border-radius: 24px;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(16, 185, 129, 0.05);
            
            /* Настройки анимации наклона при наведении вправо */
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease;
            transform-style: preserve-3d;
        }

        .profile-card:hover {
            transform: rotateY(8deg) translateY(-6px);
            border-color: rgba(52, 211, 153, 0.35);
            box-shadow: -10px 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(16, 185, 129, 0.15);
        }

        /* Аватар с зеленовато-неоновым свечением */
        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 18px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
            border: 2px solid rgba(52, 211, 153, 0.25);
        }

        .status-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid #061a0e;
            background-color: #747f8d;
        }

        /* Имя и био */
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sparkle {
            font-size: 14px;
        }

        .profile-bio {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 16px;
            font-style: italic;
            text-align: center;
        }

        /* Плашка статуса offline/online */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        .status-pill span[class^="dot-"] {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #747f8d;
        }

        .status-dot-online { background-color: #10b981 !important; box-shadow: 0 0 8px #10b981; }
        .status-dot-idle { background-color: #f59e0b !important; }
        .status-dot-dnd { background-color: #ef4444 !important; }
        .status-dot-offline { background-color: #6b7280 !important; }

        /* Блок со временем и просмотрами */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 24px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: #6b7280;
            letter-spacing: 0.5px;
        }

        /* Кнопки соцсетей (чистые, без никнеймов) */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .social-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            border-radius: 14px;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(52, 211, 153, 0.25);
            color: #fff;
            transform: translateY(-2px);
        }

        .arrow {
            color: #6b7280;
            font-size: 14px;
            transition: color 0.2s;
        }

        .social-btn:hover .arrow {
            color: #34d399;
        }

        /* --- ПРАВАЯ ЧАСТЬ (ПРОЕКТЫ) --- */
        .main-content {
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 16px;
            font-style: italic;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .project-card {
            background: rgba(6, 26, 14, 0.75);
            border: 1px solid rgba(52, 211, 153, 0.12);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-color: rgba(52, 211, 153, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .project-img-box {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .proj-emoji {
            font-size: 36px;
        }

        .project-info {
            padding: 16px;
        }

        .project-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }

        .project-info p {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 12px;
            font-style: italic;
        }

        .project-link {
            font-size: 11px;
            color: #34d399;
            text-decoration: none;
        }

        .project-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="site-container">
        <!-- Левая колонка: Карточка профиля -->
        <aside class="profile-sidebar">
            <div class="profile-card">
                <!-- Аватар и статус -->
                <div class="avatar-container">
                    <img id="discord-avatar" src="favicon.png" alt="Avatar" class="avatar-img">
                    <span id="discord-status" class="status-indicator"></span>
                </div>

                <!-- Имя и био -->
                <h1 class="profile-name">lampik2009 <span class="sparkle">✨</span></h1>
                <p id="profile-bio" class="profile-bio">i do stuff</p>

                <!-- Статус-плашка -->
                <div class="status-pill">
                    <span class="dot-offline" id="status-dot"></span>
                    <span id="status-text">offline</span>
                </div>

                <!-- Виджет времени и просмотров -->
                <div class="stats-grid">
                    <div class="stat-box">
                        <div id="local-time" class="stat-value">10:37:58 AM</div>
                        <div class="stat-label">LOCAL TIME</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">802</div>
                        <div class="stat-label">VIEWS</div>
                    </div>
                </div>

                <!-- Ссылки на соцсети (без лишних никнеймов) -->
                <div class="social-links">
                    <a href="https://discord.com/users/1142187822250471535" target="_blank" class="social-btn">
                        <span>Discord</span>
                        <span class="arrow">↗</span>
                    </a>
                    <a href="https://github.com/Haralampos2009" target="_blank" class="social-btn">
                        <span>GitHub</span>
                        <span class="arrow">↗</span>
                    </a>
                    <a href="https://www.youtube.com/@Dyser_l" target="_blank" class="social-btn">
                        <span>YouTube</span>
                        <span class="arrow">↗</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Правая колонка: Проекты -->
        <main class="main-content">
            <section class="content-section">
                <h2 class="section-title">projects</h2>
                <div class="projects-grid">
                    <!-- Карточка проекта 1 -->
                    <div class="project-card">
                        <div class="project-img-box" style="background: linear-gradient(135deg, #064e3b, #047857);">
                            <span class="proj-emoji">⚡</span>
                        </div>
                        <div class="project-info">
                            <h3>Thedyserrealm</h3>
                            <p>the site you're on</p>
                            <a href="#" class="project-link">thedyserrealm.github.io ↗</a>
                        </div>
                    </div>

                    <!-- Карточка проекта 2 -->
                    <div class="project-card">
                        <div class="project-img-box" style="background: linear-gradient(135deg, #022c22, #065f46);">
                            <span class="proj-emoji">🎮</span>
                        </div>
                        <div class="project-info">
                            <h3>Smash Blast</h3>
                            <p>my very own game</p>
                            <a href="#" class="project-link">github.com/Haralampos2009 ↗</a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Скрипт: Часы + Discord Lanyard API -->
    <script>
        // Динамические часы
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('local-time').textContent = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Данные Discord через Lanyard API
        const DISCORD_ID = '1142187822250471535';

        async function loadDiscordData() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await res.json();

                if (data.success) {
                    const { discord_user, discord_status, activities } = data.data;

                    // Аватар
                    if (discord_user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${discord_user.id}/${discord_user.avatar}.png?size=256`;
                        document.getElementById('discord-avatar').src = avatarUrl;
                    }

                    // Статус (online, idle, dnd, offline)
                    const statusDot = document.getElementById('status-dot');
                    const statusText = document.getElementById('status-text');
                    statusText.textContent = discord_status;
                    statusDot.className = `status-dot-${discord_status}`;

                    // Кастомный статус
                    if (activities && activities.length > 0) {
                        const custom = activities.find(a => a.type === 4);
                        if (custom && custom.state) {
                            document.getElementById('profile-bio').textContent = custom.state;
                        }
                    }
                }
            } catch (e) {
                console.error("Ошибка Lanyard:", e);
            }
        }
        loadDiscordData();
    </script>
</body>
</html>
